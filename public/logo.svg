<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 50" fill="none">
  <!-- ChaosBox Cyber Emblem -->
  <g transform="translate(4, 3)">
    <!-- Box Outer Shield -->
    <path d="M22 2L42 13.5V36.5L22 48L2 36.5V13.5L22 2Z" stroke="#00FF66" stroke-width="3" fill="#09090B"/>
    <!-- Box Top Face -->
    <path d="M22 5L38 14.5L22 24L6 14.5L22 5Z" fill="#00FF66" fill-opacity="0.25" stroke="#00FF66" stroke-width="1.5"/>
    <!-- Box Left Face -->
    <path d="M6 16.5L21 25.5V44.5L6 35.5V16.5Z" fill="#FFE600" fill-opacity="0.2" stroke="#FFE600" stroke-width="1.5"/>
    <!-- Box Right Face -->
    <path d="M38 16.5L23 25.5V44.5L38 35.5V16.5Z" fill="#00FF66" fill-opacity="0.1" stroke="#00FF66" stroke-width="1.5"/>
    <!-- Center Core Glow -->
    <circle cx="22" cy="25" r="3" fill="#FFE600"/>
  </g>

  <!-- Typography: CHAOSBOX -->
  <text x="56" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4" fill="#FFFFFF">
    CHAOS<tspan fill="#00FF66">BOX</tspan>
  </text>
  
  <!-- Subtitle Badge -->
  <rect x="250" y="14" width="80" height="20" fill="#18181B" stroke="#00FF66" stroke-width="1"/>
  <text x="290" y="28" font-family="monospace" font-weight="700" font-size="9" letter-spacing="2" fill="#00FF66" text-anchor="middle">
    UTILITIES
  </text>
</svg>